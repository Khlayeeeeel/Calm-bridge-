# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
spring.security.jwt.secret=your-256-bit-secret-key-here-must-be-at-least-32-characters-long
spring.security.jwt.expiration=86400000

# WebSocket Configuration
websocket.endpoint=/ws
websocket.destination-prefix=/app
websocket.broker-prefix=/topic

# Gemini API Configuration
gemini.api.key=your-gemini-api-key-here
gemini.api.model=gemini-pro
gemini.api.project-id=your-project-id
gemini.api.location=us-central1

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.example.healthcare=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE